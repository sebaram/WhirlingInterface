<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>


    <script src="https://unpkg.com/aframe-log-component/dist/aframe-log-component.min.js"></script> 
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.4.0/dist/aframe-extras.min.js"></script>


    <script type="module" src="../static/js/demo_2.js"></script>
    <script type="module" src="../static/js/hand-tracking-mediapipe.js"></script>
    <script type="module" src="../static/js/stats-panel.js"></script>

    <style>
      video {
        transform: scaleX(-1);
      }
      #mediapipe-canvas {
        transform: scaleX(-1);
      }
      /* Add some basic styling for the toggle switches */
      .switch {
        position: absolute;
        z-index: 9999;
        top:400px;
        left: 10px;
      }
      .switch label {
        display: block;
        margin-bottom: 5px;
      }
      .slider {
        display: flex;
        align-items: left;
      }
      .slider label {
        margin-right: 10px;
      }
      .dropdown {
        display: flex;
        align-items: left;
      }
      .dropdown label {
        margin-right: 10px;
      }
      
    </style>

  </head>
  <body>
    <!-- Add the toggle switches -->
    <div class="switch" style="display: none;">

      <label>
        <input type="checkbox" id="toggleVideo" checked>
        Toggle Video
      </label>
      
      <label>
        <input type="checkbox" id="toggleActiveMode">
        Toggle Active Mode
      </label>

      <div class="slider">
        <label for="radiusSlider">Radius:</label>
        <input type="range" id="radiusSlider" min="0.01" max="1" step="0.01" value="0.05">
      </div>
      
      <div class="dropdown">
        <label for="handSelector">Target Hand:</label>
        <select id="handSelector">
          <option value="right">Right</option>
          <option value="left">Left</option>
        </select>
      </div>

      <div class="dropdown">
        <label for="jointSelector">Target Joint:</label>
        <select id="jointSelector">
          <option value="wrist">Wrist</option>
          <option value="thumb_tip">Thumb</option>
          <option value="index_tip">Index</option>
          <option value="middle_tip">Middle</option>
          <option value="ring_tip">Ring</option>
          <option value="pinky_tip">Pinky</option>
        </select>
      </div>


    </div>


      <a-scene stats environment xr-mode-ui="enabled: true; enterAREnabled: true; enterVREnabled: true; XRMode: xr;" >
        <!-- <a-sky color="#ECECEC"></a-sky> -->
        <a-entity id="input-manager" input-manager></a-entity>

        <a-entity camera look-controls>
          <a-entity cursor__mouse="rayOrigin: mouse"
          cursor__xrselect="rayOrigin: xrselect"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                    material="color: black; shader: flat">
          </a-entity>
        </a-entity>

        <a-entity id="box" cursor-listener geometry="primitive: box" material="color: blue"></a-entity>




        <a-entity 
          id="hand-tracking"
          hand-tracking-mediapipe="active: true">

        </a-entity>

        <a-entity log geometry="primitive: plane" material="color: #111" text="color: lightgreen" position="-1 1.5 -2"></a-entity>
        
        <a-entity id="leftHand" hand-tracking-controls="hand: left; color: #ffcccc;"></a-entity>
        <a-entity id="rightHand" hand-tracking-controls="hand: right; color: #ffcccc; handModelStyle: toon;"></a-entity>
      </a-scene>



    <script>
      // JavaScript to handle the toggle switch functionality
      let mediapipeEnabled = true;
      let forcedActiveMode = false;

      // Handle radius slider input
      document.getElementById('radiusSlider').addEventListener('input', function() {
        const radius = parseFloat(this.value);
        // input-manager lives on the #input-manager entity, not on the scene.
        let inputManager = document.querySelector('#input-manager').components['input-manager'].manager;
        inputManager.setOrbitTargetRadius(radius);
      });

      document.getElementById('toggleVideo').addEventListener('change', function() {
        if (this.checked) {
          console.log('Video is ON');
          let videoElement = document.getElementById('mediapipe-canvas');
          // Show video
          videoElement.style.display = 'block';
        } else {
          console.log('Video is OFF');
          let videoElement = document.getElementById('mediapipe-canvas');
          // Hide video
          videoElement.style.display = 'none';
        }
      });

      document.getElementById('toggleActiveMode').addEventListener('change', function() {
        if (this.checked) {
          console.log('Forced active mode is ON');
          // Set forced active mode
        } else {
          console.log('Forced active mode is OFF');
          // Set forced active mode
        }
      });

      // Component to change to a sequential color on click.
      AFRAME.registerComponent('cursor-listener', {
        init: function () {
          var lastIndex = -1;
          var COLORS = ['red', 'green', 'blue'];
          this.el.addEventListener('click', function (evt) {
            lastIndex = (lastIndex + 1) % COLORS.length;
            this.setAttribute('material', 'color', COLORS[lastIndex]);
            console.log('I was clicked at: ', evt.detail.intersection.point);
          });
        }
      });

    </script>
  </body>
</html>
