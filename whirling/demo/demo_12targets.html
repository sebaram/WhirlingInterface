<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script type="module" src="../static/js/demo_12.js"></script>
    <script type="module" src="../static/js/hand-tracking.js"></script>
    <script type="module" src="../static/js/stats-panel.js"></script>
    <script type="module" src="../static/js/controls-panel.js"></script>
    <script type="module" src="../static/js/target-picker.js"></script>
    <script type="module" src="../static/js/size-controls.js"></script>

    

    <style>
      video {
        transform: scaleX(-1);
      }
      #mediapipe-canvas {
        transform: scaleX(-1);
      }
      /* Add some basic styling for the toggle switches */
      .switch {
        position: absolute;
        z-index: 9999;
        top:400px;
        left: 10px;
      }
      .switch label {
        display: block;
        margin-bottom: 5px;
      }
      .slider {
        display: flex;
        align-items: left;
      }
      .slider label {
        margin-right: 10px;
      }
      .dropdown {
        display: flex;
        align-items: left;
      }
      .dropdown label {
        margin-right: 10px;
      }
      
    </style>

  </head>
  <body>
    <!-- Add the toggle switches -->
    <div class="switch">
      <!-- Visual hand/joint picker, built by static/js/target-picker.js.
           The selects below stay as the source of truth for hand-tracking. -->
      <div id="targetPicker"></div>

      <select id="handSelector" hidden>
        <option value="right">Right</option>
        <option value="left">Left</option>
      </select>
      <select id="jointSelector" hidden>
        <option value="wrist">Wrist</option>
        <option value="thumb_tip">Thumb</option>
        <option value="index_tip">Index</option>
        <option value="middle_tip">Middle</option>
        <option value="ring_tip">Ring</option>
        <option value="pinky_tip">Pinky</option>
      </select>

      <hr class="cp-rule">

      <div class="slider">
        <label for="orbitSlider">Orbit:</label>
        <input type="range" id="orbitSlider" min="0.02" max="0.5" step="0.001">
        <span id="orbitValue" class="readout"></span>
      </div>

      <div class="slider">
        <label for="radiusSlider">Target:</label>
        <input type="range" id="radiusSlider" min="0.005" max="0.25" step="0.001">
        <span id="radiusValue" class="readout"></span>
      </div>

      <hr class="cp-rule">

      <label>
        <input type="checkbox" id="toggleVideo" checked>
        Show webcam preview
      </label>

      <label>
        <input type="checkbox" id="toggleActiveMode">
        Force active (no hand needed)
      </label>
    
    </div>

    <a-scene stats xr-mode-ui="enabled: true; enterAREnabled: true; enterVREnabled: true; XRMode: xr;" >
      
      <!-- <a-sky color="#ECECEC"></a-sky> -->
       <a-entity id="input-manager" input-manager></a-entity>
      <a-entity 
      id="hand-tracking"
      hand-tracking-base
      hand-tracking-webxr="active: false"
      hand-tracking-mediapipe="active: true">
    </a-entity>

    </a-scene>

    <script>
      // JavaScript to handle the toggle switch functionality
      let mediapipeEnabled = true;
      let forcedActiveMode = false;

      // Orbit / target sliders are wired up in static/js/size-controls.js

      // Webcam preview toggle (checkbox + click on the preview itself) is
      // handled in static/js/controls-panel.js

      document.getElementById('toggleActiveMode').addEventListener('change', function() {
        if (this.checked) {
          console.log('Forced active mode is ON');
          // Set forced active mode
        } else {
          console.log('Forced active mode is OFF');
          // Set forced active mode
        }
      });

    </script>
  </body>
</html>
