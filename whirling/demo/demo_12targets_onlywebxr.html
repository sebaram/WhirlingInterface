<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Whirling Interface - 12 targets, headset</title>
    <!-- Plain grid, no environment: in AR the room around you is the real one,
         and a virtual gallery would sit between you and it. ?scene=museum and
         ?scene=outdoor still work if you want a backdrop in VR. -->
    <meta name="whirling-default-scene" content="lab">

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.0/dist/aframe-environment-component.min.js"></script>

    <script type="module" src="../static/js/demo_12.js"></script>
    <script type="module" src="../static/js/hand-tracking-webxr.js"></script>
    <script type="module" src="../static/js/stats-panel.js"></script>
    <script type="module" src="../static/js/select-ray.js"></script>
  </head>
  <body>

    <a-scene stats
             xr-mode-ui="enabled: true; enterVREnabled: true; enterAREnabled: true; XRMode: xr;"
             webxr="optionalFeatures: hand-tracking, local-floor">

      <a-entity id="input-manager" input-manager></a-entity>

      <!-- ?select=ray swaps motion matching for the ray+pinch baseline -->
      <a-entity ray-pinch-select="hand: right"></a-entity>

      <a-entity camera look-controls wasd-controls position="0 1.6 0">
        <a-entity cursor__mouse="rayOrigin: mouse"
                  cursor__xrselect="rayOrigin: xrselect"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.006; radiusOuter: 0.009"
                  material="color: black; shader: flat">
        </a-entity>
      </a-entity>

      <!-- hand-tracking-webxr tracks the right wrist through WebXR itself, so
           there is no MediaPipe and no hand/joint selector on this page. -->
      <a-entity id="hand-tracking" hand-tracking-webxr="active: true"></a-entity>

      <a-entity id="leftHand" hand-tracking-controls="hand: left; color: #ffcccc;"></a-entity>
      <a-entity id="rightHand" hand-tracking-controls="hand: right; color: #ffcccc;"></a-entity>
    </a-scene>

  </body>
</html>
